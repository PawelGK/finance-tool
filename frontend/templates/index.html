<!DOCTYPE html>
<html>
<head>
    <title>Finance Tool</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 520px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.12);
        }

        h1 {
            color: #1f3b73;
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #555;
            margin-bottom: 30px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 16px;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #bbb;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
        }

        .buttons {
            display: flex;
            gap: 10px;
            margin-top: 24px;
        }

        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        .primary {
            background: #1f6feb;
            color: white;
        }

        .secondary {
            background: #e5e7eb;
            color: #222;
        }

        .primary:hover {
            background: #1557b0;
        }

        .secondary:hover {
            background: #d1d5db;
        }

        .result-card {
            margin-top: 25px;
            padding: 18px;
            background: #eef6ff;
            border-left: 5px solid #1f6feb;
            border-radius: 8px;
            display: none;
        }

        .result-card h2 {
            margin: 0 0 8px 0;
            color: #1f3b73;
        }

        .error {
            margin-top: 20px;
            color: #b00020;
            font-weight: bold;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Finance Tool</h1>
        <p class="subtitle">Calculate profit and profit margin from revenue and cost.</p>

        <label for="revenue">Revenue</label>
        <input type="number" id="revenue" placeholder="Example: 3000">

        <label for="cost">Cost</label>
        <input type="number" id="cost" placeholder="Example: 2000">

        <div class="buttons">
            <button class="primary" onclick="calculateProfit()">Calculate</button>
            <button class="secondary" onclick="resetForm()">Reset</button>
        </div>

        <div id="resultCard" class="result-card">
            <h2 id="profitResult"></h2>
            <p id="marginResult"></p>
            <p id="summaryResult"></p>
        </div>

        <p id="errorMessage" class="error"></p>

        <div class="footer">
            Frontend: Azure Web App | Backend: Azure Function
        </div>
    </div>

    <script>
        async function calculateProfit() {
            const revenue = Number(document.getElementById("revenue").value);
            const cost = Number(document.getElementById("cost").value);

            const resultCard = document.getElementById("resultCard");
            const profitResult = document.getElementById("profitResult");
            const marginResult = document.getElementById("marginResult");
            const summaryResult = document.getElementById("summaryResult");
            const errorMessage = document.getElementById("errorMessage");

            resultCard.style.display = "none";
            errorMessage.innerText = "";

            if (isNaN(revenue) || isNaN(cost) || revenue <= 0 || cost < 0) {
                errorMessage.innerText = "Please enter valid numbers. Revenue must be above 0 and cost cannot be negative.";
                return;
            }

            profitResult.innerText = "Calculating...";
            resultCard.style.display = "block";

            try {
                const response = await fetch("https://finance-tool-backend-rika-h7c0a6ekh6fmhrf9.spaincentral-01.azurewebsites.net/api/calculate", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        revenue: revenue,
                        cost: cost
                    })
                });

                const data = await response.json();

                if (response.ok && data.profit !== undefined) {
                    const profit = data.profit;
                    const margin = ((profit / revenue) * 100).toFixed(2);

                    profitResult.innerText = "Profit: $" + profit;
                    marginResult.innerText = "Profit Margin: " + margin + "%";
                    summaryResult.innerText = "Revenue: $" + revenue + " | Cost: $" + cost;
                } else {
                    resultCard.style.display = "none";
                    errorMessage.innerText = "Error: " + (data.error || "Unknown error");
                }
            } catch (error) {
                resultCard.style.display = "none";
                errorMessage.innerText = "Request failed: " + error.message;
            }
        }

        function resetForm() {
            document.getElementById("revenue").value = "";
            document.getElementById("cost").value = "";
            document.getElementById("resultCard").style.display = "none";
            document.getElementById("errorMessage").innerText = "";
        }
    </script>
</body>
</html>
